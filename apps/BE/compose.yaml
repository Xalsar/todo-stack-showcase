services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: todo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: todos
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - todo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos -d todos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  todo_pg_data:
